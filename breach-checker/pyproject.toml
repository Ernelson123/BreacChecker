[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breach-checker"
version = "0.1.0"
description = "Verificador de vazamento de credenciais"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.15.0",
    "rich>=14.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.11.0",
]

[project.scripts]
breach-checker = "breach_checker.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build]
packages = ["src/breach_checker"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E","W","F","I","N","S","UP","B"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S","N"]
"src/breach_checker/checker.py" = ["S324"]  #SHA-1 necessário para HIBP k-anonymity

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/breach_checker"]

[tool.coverage.report]
fail_under = 80
show_missing = true

